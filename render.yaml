services:
  # Web Service
  - type: web
    name: game-of-life-rails
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-of-life-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: game-of-life-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: true

  # Sidekiq Worker
  - type: worker
    name: game-of-life-sidekiq
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec sidekiq"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-of-life-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: game-of-life-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

databases:
  - name: game-of-life-db
    plan: free
    databaseName: game_of_life_production
    user: game_of_life

  - name: game-of-life-redis
    plan: free

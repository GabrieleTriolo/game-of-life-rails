services:
  db:
    image: postgres:15
    container_name: gameoflife-db
    restart: always
    environment:
      POSTGRES_DB: game_of_life_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gameoflife-redis
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  web:
    build: .
    container_name: gameoflife-web
    depends_on:
      - db
      - redis
    volumes:
      - .:/rails              
      - bundle-data:/usr/local/bundle
    ports:
      - "3000:3000"            # Rails
      - "12345:12345"          # porta debug rdbg
    environment:
      RAILS_ENV: development

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: game_of_life_development
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0

      # Debug Ruby (gem debug / rdbg)
      RUBY_DEBUG_OPEN: "true"
      RUBY_DEBUG_PORT: "12345"
      RUBY_DEBUG_HOST: "0.0.0.0"
      RUBY_DEBUG_NONSTOP: "true"

  sidekiq:
    build: .
    container_name: gameoflife-sidekiq
    depends_on:
      - db
      - redis
    volumes:
      - .:/rails               # anche sidekiq lavora in /rails
      - bundle-data:/usr/local/bundle
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: game_of_life_development
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_CABLE: redis://redis:6379/1
      RUBY_DEBUG_OPEN: "false"
    command: bundle exec sidekiq

volumes:
  db-data:
  redis-data:
  bundle-data: